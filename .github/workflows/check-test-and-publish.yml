name: Check, Test & Publish

on:
  workflow_call:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check, run tests and generate JaCoCo report
        run: ./gradlew check jacocoTestReport --no-daemon

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

  publish:
    name: Publish Code Coverage
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: build/reports/jacoco/test/html/badges

      - name: Publish coverage report to GH Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/reports/jacoco/test/html
          token: ${{ secrets.GITHUB_TOKEN }}